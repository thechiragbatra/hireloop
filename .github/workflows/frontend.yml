name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.API_BASE_URL != '' && vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write public frontend configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "apiBaseUrl": os.environ.get("API_BASE_URL", ""),
              "supabaseUrl": os.environ.get("SUPABASE_URL", ""),
              "supabaseAnonKey": os.environ.get("SUPABASE_ANON_KEY", ""),
          }
          missing = [key for key, value in config.items() if not value]
          if missing:
              raise SystemExit("Set the GitHub Actions variables API_BASE_URL, SUPABASE_URL, and SUPABASE_ANON_KEY before deploying.")
          Path("frontend/config.js").write_text(
              "window.HIRELOOP_CONFIG = " + json.dumps(config) + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
