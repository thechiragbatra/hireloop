name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hireloop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install -r requirements.txt

      - name: Run Alembic migration check
        run: |
          cd backend
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/hireloop_test alembic upgrade head

      - name: Run tests
        run: |
          cd backend
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/hireloop_test \
          DATABASE_URL_ASYNC=postgresql+asyncpg://postgres:postgres@localhost:5432/hireloop_test \
          pytest -q

      - name: Run lint
        run: |
          cd backend
          ruff check .
          ruff format --check .
          mypy app
