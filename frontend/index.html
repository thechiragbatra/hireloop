<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireLoop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <div class="nav-logo">HireLoop</div>
            <div class="nav-links">
                <button class="nav-link active" data-page="home">Home</button>
                <button class="nav-link" data-page="jobs">Jobs</button>
                <button class="nav-link" data-page="tracker">Tracker</button>
            </div>
        </div>
    </nav>

    <main>
        <!-- Home -->
        <section id="home" class="page active">
            <div class="hero">
                <h1 class="hero-title">Find your next role.<br>Tailor with precision.</h1>
                <p class="hero-subtitle">Upload your resume and get matched to real opportunities in one click.</p>
                <div class="upload-zone" id="uploadZone">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <path d="M24 16v16M16 24h16M12 8h24a4 4 0 014 4v24a4 4 0 01-4 4H12a4 4 0 01-4-4V12a4 4 0 014-4z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <p class="upload-text">Drop resume here or <span class="upload-link">browse</span></p>
                    <p class="upload-subtext">PDF or DOCX</p>
                    <input type="file" id="resumeFile" accept=".pdf,.docx,.doc" hidden>
                </div>
                <div id="status" class="status"></div>
            </div>
        </section>

        <!-- Jobs -->
        <section id="jobs" class="page">
            <div class="page-header">
                <h2 class="page-title">Jobs</h2>
                <button class="btn" onclick="loadJobs()">Refresh</button>
            </div>
            <div id="jobsGrid" class="jobs-grid"></div>
        </section>

        <!-- Tracker -->
        <section id="tracker" class="page">
            <div class="page-header">
                <h2 class="page-title">Tracker</h2>
                <button class="btn btn-secondary" onclick="exportTracker()">Export CSV</button>
            </div>
            <div id="trackerList" class="tracker-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
