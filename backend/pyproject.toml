[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-copilot-backend"
version = "0.1.0"
description = "Job Copilot backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "langgraph>=0.1",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "sentence-transformers>=2.7",
    "rank-bm25>=0.2",
    "faiss-cpu>=1.8",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-python-dateutil>=2.9",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
